    <style>
.sec1 {
  background: #0c001e;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 2rem 0;
}

.form-card {
  background: #fff;
  padding: 2rem;
  border-radius: 16px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.15);
  width: 90%;
  max-width: 600px;
}

.form-card h3 {
  text-align: center;
  margin-bottom: 1.5rem;
  color: #fff;
}

.form-group {
  margin-bottom: 1.2rem;
}

.form-group label {
  display: block;
  margin-bottom: 0.4rem;
  font-weight: 600;
  color: #333;
}

.form-group input,
.form-group select,
.form-group textarea {
  width: 100%;
  padding: 10px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 1rem;
  outline: none;
  transition: border 0.3s;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
  border-color: #0c0;
}

.radio-group {
  display: flex;
  flex-wrap: wrap;
  gap: 1rem;
}

.radio-group label {
  font-weight: 500;
  color: #444;
}

#btn {
  background: #0c0;
  color: #fff;
  padding: 12px;
  border: none;
  border-radius: 8px;
  width: 100%;
  font-size: 1rem;
  cursor: pointer;
  transition: background 0.3s ease;
}

#btn:hover {
  background: rgb(16, 109, 16);
}



    </style>

<section class="sec1">
  <div class="form-card">
    <h3 style="color: #0c001e;">ENQUIRY FORM</h3>
    <form id="enquiry-form" 
    action="https://formspree.io/f/xnnbqbny"
    method="POST">
      <div class="form-group">
        <label for="fname">First Name</label>
        <input type="text" id="fname" name="firstname" placeholder="Enter first name" required>
      </div>

      <div class="form-group">
        <label for="lname">Last Name</label>
        <input type="text" id="lname" name="lastname" placeholder="Enter last name" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="Email" placeholder="Enter your email" required>
      </div>

      <div class="form-group">
        <label for="tel">Whatsapp Number (Please enter correctly or we may not be able to reach
                            you.)</label>
        <input type="tel" id="tel" name="Tel" placeholder="Enter phone number" required>
      </div>

      <div class="form-group">
        <label>Services</label>
        <select name="cooperate">
          <option disabled selected>Select a cooperate style</option>
          <option>Cooperate Gown</option>
          <option>Blazers</option>
          <option>Shirt & Cooperate Trousers</option>
        </select>
        <br>
        <br>

        <select name="casual">
          <option disabled selected>Select a casual style</option>
          <option>Top & Trouser</option>
          <option>Short Gown</option>
          <option>Skirt & Top</option>
        </select>
        <br>
        <br>

        <select name="owanbe">
          <option disabled selected>Select an Owanbe style</option>
          <option>Iro & Buba</option>
          <option>Padded Gown</option>
          <option>Bubu</option>
        </select>
      </div>

      <div class="form-group">
        <label>Size</label>
        <div class="radio-group">
          <label><input type="radio" name="sizes" value="XL"> XL</label>
          <label><input type="radio" name="sizes" value="L"> L</label>
          <label><input type="radio" name="sizes" value="M"> M</label>
          <label><input type="radio" name="sizes" value="S"> S</label>
          <label><input type="radio" name="sizes" value="XS"> XS</label>
        </div>
      </div>

      <div class="form-group">
        <label>Do you require shipping?</label>
        <div class="radio-group">
          <label><input type="radio" name="shipping" value="Yes"> Yes</label>
          <label><input type="radio" name="shipping" value="No"> No (Pick up in Lagos)</label>
        </div>
      </div>

      <div class="form-group">
        <label for="address">Delivery Address (if shipping)</label>
        <input type="text" id="address" name="address" placeholder="Enter full address with city & country">
      </div>

      <div class="form-group">
        <label for="information">Additional Information</label>
        <textarea id="information" name="information" placeholder="Any other details..." rows="4"></textarea>
      </div>

<p id="formMessage" class="form-message">
  <!-- Form submitted successfully! -->
</p>


      <button type="submit" id="btn">Submit</button>
    </form>
  </div>
</section>
